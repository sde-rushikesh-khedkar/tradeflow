// TradeFlow — LedgerService gRPC Contract
// Version: 1.1

/**
 * Synchronous contract between order-service (client) and ledger-service (server).
 *
 * <p>Why gRPC: confirming an order requires a synchronous wallet-funds check.
 * Protobuf is a versioned binary schema — a field change that breaks the
 * contract fails at compile time on both services, not at runtime.
 *
 * <p>Naming: RPC names are imperative verbs (ReserveFunds, not FundsReserved).
 * Message names match the RPC name with Request/Response suffix.
 */

syntax = "proto3";

package io.tradeflow.proto.ledger;

option java_package         = "io.tradeflow.proto.ledger";
option java_outer_classname = "LedgerProto";
option java_multiple_files  = true;

service LedgerService {

    /**
     * Holds funds in escrow against an order. Called before an order is
     * confirmed. Idempotent — a retry with the same idempotency_key returns
     * the original reservation instead of reserving twice.
     */
    rpc ReserveFunds (ReserveFundsRequest) returns (ReserveFundsResponse);

    /**
     * Finalizes a reservation: moves escrow funds to revenue. Called
     * once an order is confirmed. The captured amount is read from the
     * ledger, not taken from the request, so a bad request can't capture
     * the wrong sum.
     */
    rpc CaptureFunds (CaptureFundsRequest) returns (CaptureFundsResponse);

    /**
     * Returns available and reserved balance for a user. Read-only.
     */
    rpc GetBalance (GetBalanceRequest) returns (GetBalanceResponse);

}

// ── ReserveFunds ────────────────────────────────────────────────────────────

/**
 * Request to hold funds in escrow.
 */
message ReserveFundsRequest {
    string idempotency_key  = 1;  // client-generated UUID; unique constraint enforces exactly-once
    string user_id          = 2;
    string order_id         = 3;
    int64  amount_cents     = 4;  // always integer cents — never a float
    string currency         = 5;  // ISO 4217, e.g. "USD"
}

/**
 * Result of a reservation attempt.
 */
message ReserveFundsResponse {
    bool   success          = 1;
    string reservation_id   = 2;  // pass to CaptureFunds to finalize this hold
    string failure_reason   = 3;  // set only when success = false
}

// ── CaptureFunds ────────────────────────────────────────────────────────────

/**
 * Request to finalize an existing reservation.
 */
message CaptureFundsRequest {
    string idempotency_key  = 1;
    string user_id          = 2;
    string order_id         = 3;
    string reservation_id   = 4;  // from ReserveFundsResponse
    string currency         = 5;
}

/**
 * Result of a capture attempt.
 */
message CaptureFundsResponse {
    bool   success           = 1;
    int64  captured_cents    = 2;  // amount captured, read from the ledger — for audit logging
    string failure_reason    = 3;  // set only when success = false
}

// ── GetBalance ──────────────────────────────────────────────────────────────

/**
 * Request for a user's current balance.
 */
message GetBalanceRequest {
    string user_id      = 1;
    string currency     = 2;
}

/**
 * A user's current balance, split by availability.
 */
message GetBalanceResponse {
    string user_id                  = 1;
    int64  available_balance_cents  = 2;  // spendable now = total − reserved
    int64  reserved_balance_cents   = 3;  // held pending order confirmation
    string currency                 = 4;
}
