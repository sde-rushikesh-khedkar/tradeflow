spring:
  application:
    name: ledger-service
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
  mvc:
    problemdetails:
      enabled: true
  kafka:
    consumer:
      group-id: ${spring.application.name}
      enable-auto-commit: false          # offset committed only by ack.acknowledge(), after the DB tx commits
      auto-offset-reset: earliest        # a brand-new group starts from the oldest message, so no cancellation is skipped
      max-poll-records: 50               # each record is one DB tx; small batches keep us well inside max.poll.interval.ms
      fetch-max-wait: 500ms              # long poll: broker holds the fetch until data arrives or this elapses
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: io.tradeflow.ledger.kafka.event.OrderEvent
        spring.json.use.type.headers: false   # ignore the producer's class-name header; order-service's classes differ
    listener:
      ack-mode: manual_immediate
      poll-timeout: 5s

app:
  security:
    rsa:
      public-key-location: classpath:keys/public.pem
  kafka:
    topics:
      order-events: order-events
      order-events-dlt: order-events-dlt

grpc:
  server:
    port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    console: "%d{ISO8601} [%X{traceId},%X{spanId}] %-5level %logger{36} - %msg%n"
